[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixcli"
version = "0.1.0"
description = "Local, key-aware auto-mixtape CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10",
  "soundfile>=0.12",
  "numpy>=1.24",
  "click>=8",
  "rich>=13",
  "pyloudnorm>=0.1.1",
  "PyYAML>=6",
  "mutagen>=1.47"
]

[project.scripts]
mixcli = "mixcli.cli:cli"

[tool.setuptools.packages.find]
include = ["mixcli*"]
